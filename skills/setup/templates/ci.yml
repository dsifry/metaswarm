# CI Pipeline — toolchain, (Node: lint, typecheck), test with coverage
# Scaffolded by metaswarm /setup. Customize for your project.
#~
#~ This is a template. /setup renders it with lib/render-ci.sh, which keeps the
#~ toolchain block for your stack (between "# @toolchain <stack>" and "# @end"),
#~ drops the other blocks, the markers and these "#~" lines, and writes your
#~ repo's default branch into push.branches. If you copy it by hand, do the same.

name: CI

on:
  push:
    branches: [main] # @branch
  # Every pull request is checked, whatever branch it targets.
  pull_request:

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # @toolchain node
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # Lint and typecheck run when package.json defines the script, and fail
      # the build when it fails. A missing script is skipped; a package.json
      # that can't be parsed fails the step.
      - name: Lint
        run: |
          rc=0; node -e "let p; try { p = JSON.parse(require('fs').readFileSync('package.json', 'utf-8')); } catch (e) { console.error('package.json: ' + e.message); process.exit(2); } process.exit(p.scripts?.[process.argv[1]] ? 0 : 1)" lint || rc=$?
          if [ "$rc" -eq 0 ]; then
            npm run lint
          elif [ "$rc" -eq 1 ]; then
            echo "No lint script in package.json; skipping"
          else
            exit "$rc"   # package.json could not be parsed
          fi

      - name: Typecheck
        run: |
          rc=0; node -e "let p; try { p = JSON.parse(require('fs').readFileSync('package.json', 'utf-8')); } catch (e) { console.error('package.json: ' + e.message); process.exit(2); } process.exit(p.scripts?.[process.argv[1]] ? 0 : 1)" typecheck || rc=$?
          if [ "$rc" -eq 0 ]; then
            npm run typecheck
          elif [ "$rc" -eq 1 ]; then
            echo "No typecheck script in package.json; skipping"
          else
            exit "$rc"   # package.json could not be parsed
          fi
      # @end

      # @toolchain python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          # Install the project itself when setup.py or pyproject.toml defines one;
          # many keep only [tool.*] settings in pyproject.toml and list
          # dependencies in requirements files.
          if [ -f setup.py ] || { [ -f pyproject.toml ] && grep -qE '^\[(project|build-system)\]' pyproject.toml; }; then
            pip install -e ".[dev]" || pip install -e .
          fi
          pip install pytest pytest-cov
      # @end

      # @toolchain go
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download
      # @end

      # @toolchain rust
      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      # @end

      - name: Test with coverage
        run: |
          if [ -f .coverage-thresholds.json ]; then
            # Read command from coverage config
            CMD=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.coverage-thresholds.json','utf-8')).enforcement.command)")
            echo "Running coverage command: $CMD"
            # Split into array for safe execution
            read -ra CMD_ARRAY <<< "$CMD"
            # Validate first word is a known package manager/runner
            case "${CMD_ARRAY[0]}" in
              npm|pnpm|yarn|npx|bun|cargo|pytest|go|make) ;;
              *) echo "Error: enforcement command must start with a known package manager/runner"; exit 1 ;;
            esac
            # Reject shell metacharacters in the full command string
            if echo "$CMD" | grep -qE '[;|&`$(){}<>\\]'; then
              echo "Error: enforcement command contains disallowed shell metacharacters"
              exit 1
            fi
            # Execute as array — prevents all shell metacharacter interpretation
            "${CMD_ARRAY[@]}"
          else
            echo "Error: no .coverage-thresholds.json; run /setup to create it"
            exit 1
          fi
