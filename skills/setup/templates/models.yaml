# metaswarm models v1 — one place to set each phase's model
roles:
  design-reviewer:
    claude: opus
    codex: gpt-5.3-codex
    gemini: pro
  plan-reviewer:
    claude: opus
    codex: gpt-5.3-codex
    gemini: pro
  # researcher: deprecated alias of codebase-researcher (one release). roles.researcher is still
  # read: it sets the codebase-researcher model when roles.codebase-researcher is not set.
  codebase-researcher:
    claude: sonnet
  deep-researcher:
    claude: fable
    codex: gpt-5.3-codex
    gemini: pro
  # deep-researcher-second: the second arm of dual-arm deep research (same brief, a second model)
  deep-researcher-second:
    claude: opus
  citation-checker:
    claude: haiku
  planner:
    claude: opus
  mechanical-coder:
    claude: haiku
    codex: gpt-5.3-codex
    gemini: flash
  coder:
    claude: sonnet
    codex: gpt-5.3-codex
    gemini: flash
  supercoder:
    claude: opus
    codex: gpt-5.3-codex
    gemini: pro
  debugger:
    claude: fable
    codex: gpt-5.3-codex
    gemini: pro
  security-coder:
    claude: fable
    codex: gpt-5.3-codex
    gemini: pro
  adversarial-reviewer:
    claude: opus
    codex: gpt-5.3-codex
    gemini: pro
  pr-shepherd-agent:
    claude: sonnet
  knowledge-curator-agent:
    claude: sonnet
# escalation.coder: after this many failed VALIDATE attempts the orchestrator re-spawns the
# supercoder role (roles.supercoder above). escalation.coder.claude is still honoured as the
# supercoder's Claude model when roles.supercoder.claude is not set.
escalation:
  coder:
    after_failures: 2
    claude: opus
