# Coverage Enforcement CI Job
#
# Two strategies are provided:
#
# Strategy A: Simple (single job)
#   Use when your test suite runs in < 2 minutes.
#   Copy the "coverage-simple" job below.
#
# Strategy B: Shard and merge (fast, for large test suites)
#   Use when your test suite takes > 2 minutes.
#   Collect coverage alongside sharded test runs, then merge results
#   in a lightweight job. This avoids re-running the entire test suite
#   for coverage (which can add 4-5 minutes to your CI pipeline).
#
# In both cases, add the job key you used ("coverage-simple" or
# "coverage-merge") to the `needs:` array of your merge-gating job
# so PRs cannot merge until thresholds pass.
#
# Adapting the install step
#   The "Install dependencies" step handles JavaScript projects (pnpm, yarn,
#   bun or npm, picked from the lockfile) and fails for anything else. For
#   other stacks, replace it with your toolchain's setup action and install
#   command. Keep actions/setup-node: the next step reads
#   .coverage-thresholds.json with node. For example:
#     Poetry:  pipx install poetry && poetry install --with dev
#              (after actions/setup-python)
#     uv:      astral-sh/setup-uv, then `uv sync --all-groups`
#     Pipenv:  pip install pipenv && pipenv install --dev
#     Java:    actions/setup-java, then let mvn/gradle fetch dependencies
#   pnpm and yarn come from corepack, and bun from npm: pin the version with a
#   "packageManager" field in package.json (e.g. "bun@1.1.38"), or CI uses a
#   default or latest version, which may not read an older lockfile. A project that is both JavaScript and Python (say,
#   Poetry plus a package.json) keeps this step and adds its Python setup and
#   install steps after it, instead of replacing it.
#   If the coverage command runs through the tool (e.g. `poetry run pytest`),
#   note that the CI template's runner allowlist doesn't apply here: this job
#   runs enforcement.command as written.

# ──────────────────────────────────────────────────────
# Strategy A: Simple (single job, runs all tests with coverage)
# ──────────────────────────────────────────────────────

coverage-simple:
  name: Coverage Enforcement
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Install dependencies
      # JavaScript projects: picks the package manager from the lockfile.
      # Other stacks: replace this step with your toolchain's setup and install
      # steps (see "Adapting the install step" at the top of this file).
      run: |
        if [ ! -f package.json ]; then
          echo "No package.json: replace this step with your project's toolchain and install steps (see the top of ci-coverage-job.yml)" >&2
          exit 1
        elif [ -f pnpm-lock.yaml ]; then
          corepack enable && pnpm install --frozen-lockfile
        elif [ -f yarn.lock ]; then
          corepack enable
          # Yarn Berry (2+) writes __metadata into yarn.lock; classic doesn't.
          if [ -f .yarnrc.yml ] || grep -q '^__metadata:' yarn.lock; then
            yarn install --immutable
          else
            yarn install --frozen-lockfile
          fi
        elif [ -f bun.lockb ] || [ -f bun.lock ]; then
          # Install the bun version pinned in package.json's packageManager, if any.
          BUN_VERSION=$(node -e "try { const m = /^bun@(.+)$/.exec(require(require('path').resolve('package.json')).packageManager || ''); console.log(m ? m[1] : 'latest'); } catch { console.log('latest'); }")
          npm install -g "bun@$BUN_VERSION" && bun install --frozen-lockfile
        elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
          npm ci
        else
          npm install
        fi

    - name: Read coverage command from .coverage-thresholds.json
      id: read-cmd
      run: |
        if [ ! -f .coverage-thresholds.json ]; then
          echo "No .coverage-thresholds.json found — skipping coverage enforcement"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        CMD=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.coverage-thresholds.json','utf-8')).enforcement.command)")
        echo "cmd=$CMD" >> "$GITHUB_OUTPUT"

    - name: Run coverage enforcement
      if: steps.read-cmd.outputs.skip != 'true'
      run: ${{ steps.read-cmd.outputs.cmd }}

# ──────────────────────────────────────────────────────
# Strategy B: Shard and merge (for large test suites)
# ──────────────────────────────────────────────────────
#
# Prerequisites:
#   1. vitest.config.unit.ts must include coverage settings:
#        coverage: {
#          provider: "v8",
#          reporter: ["json"],
#          reportsDirectory: "coverage/shard",
#          exclude: sharedCoverageExclude,
#          reportOnFailure: true,
#        }
#
#   2. A merge script (e.g., scripts/merge-coverage.ts) that:
#      - Reads all coverage JSON files from a directory
#      - Merges them with istanbul-lib-coverage
#      - Checks thresholds from .coverage-thresholds.json
#      - Exits non-zero if any threshold is not met
#
# Add these steps to your existing test shard jobs:

# --- In your test-unit shard job, AFTER running tests: ---

#     - name: Run unit tests with coverage (shard ${{ matrix.shard }}/N)
#       run: pnpm test:unit --shard=${{ matrix.shard }}/N --coverage
#
#     - name: Rename coverage for unique shard identification
#       if: ${{ !cancelled() }}
#       run: mv coverage/shard/coverage-final.json coverage/shard/shard-${{ matrix.shard }}.json
#
#     - name: Upload coverage data
#       if: ${{ !cancelled() }}
#       uses: actions/upload-artifact@v4
#       with:
#         name: coverage-shard-${{ matrix.shard }}
#         path: coverage/shard/shard-${{ matrix.shard }}.json
#         retention-days: 1

# --- Then add this lightweight merge job: ---

coverage-merge:
  name: Coverage
  runs-on: ubuntu-latest
  needs: [test-unit]  # wait for all shards to finish
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Install dependencies
      # JavaScript projects: picks the package manager from the lockfile.
      # Other stacks: replace this step with your toolchain's setup and install
      # steps (see "Adapting the install step" at the top of this file).
      run: |
        if [ ! -f package.json ]; then
          echo "No package.json: replace this step with your project's toolchain and install steps (see the top of ci-coverage-job.yml)" >&2
          exit 1
        elif [ -f pnpm-lock.yaml ]; then
          corepack enable && pnpm install --frozen-lockfile
        elif [ -f yarn.lock ]; then
          corepack enable
          # Yarn Berry (2+) writes __metadata into yarn.lock; classic doesn't.
          if [ -f .yarnrc.yml ] || grep -q '^__metadata:' yarn.lock; then
            yarn install --immutable
          else
            yarn install --frozen-lockfile
          fi
        elif [ -f bun.lockb ] || [ -f bun.lock ]; then
          # Install the bun version pinned in package.json's packageManager, if any.
          BUN_VERSION=$(node -e "try { const m = /^bun@(.+)$/.exec(require(require('path').resolve('package.json')).packageManager || ''); console.log(m ? m[1] : 'latest'); } catch { console.log('latest'); }")
          npm install -g "bun@$BUN_VERSION" && bun install --frozen-lockfile
        elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
          npm ci
        else
          npm install
        fi

    - name: Download coverage from all shards
      uses: actions/download-artifact@v4
      with:
        path: coverage/shards
        pattern: coverage-shard-*
        merge-multiple: true

    - name: Merge coverage and check thresholds
      run: npx tsx scripts/merge-coverage.ts coverage/shards
