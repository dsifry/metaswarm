name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Tests & Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate plugin.json
        run: node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf-8'))"

      - name: Validate hooks.json
        run: node -e "JSON.parse(require('fs').readFileSync('hooks/hooks.json','utf-8'))"

      - name: Check session-start.sh is executable
        run: test -x hooks/session-start.sh

      - name: Run all test suites
        run: bash -c 'shopt -s nullglob; for f in tests/*/test-*.sh; do echo "== $f"; bash "$f" || exit 1; done'

      - name: Run metaswarm-usage tests with coverage
        run: node --test --experimental-test-coverage tests/lib/metaswarm-usage.test.mjs

      - name: Verify co-located resources are in sync
        run: node lib/sync-resources.js --check
