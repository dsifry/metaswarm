# escalation.coder: after this many failed VALIDATE attempts the orchestrator re-spawns the
# supercoder role (roles.supercoder above). escalation.coder.claude is still honoured as the
# supercoder's Claude model when roles.supercoder.claude is not set.
escalation:
  coder:
    after_failures: 2
    claude: opus
